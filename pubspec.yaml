name: fayemath_academy
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # État partagé — providers Riverpod (câblé au Lot B)
  flutter_riverpod: ^3.4.2
  # Navigation déclarative (câblé au Lot C)
  go_router: ^17.3.0
  # Base locale offline-first : API Drift + enrobage Flutter (moteur SQLite
  # + ouverture du fichier). drift_flutter tire sqlite3_flutter_libs en
  # transitif, ce qui nous isole de la migration EOL de ce paquet. (Lot D)
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  # Client HTTP hors-Supabase : téléchargement des PDF hors-ligne
  # (progression, annulation, streaming disque). (offline-first)
  dio: ^5.11.0
  # Client Supabase — Auth, base de données, Storage (câblé au Lot E)
  supabase_flutter: ^2.16.0
  # Coffre chiffré (Android Keystore) pour les jetons de session Supabase, au
  # lieu de SharedPreferences en clair (SECURITY.md §2). Branché à
  # Supabase.initialize à l'étape 13.
  # ÉPINGLÉ sur la branche 10.x : la 11.0.0 (sortie le 06/08/2026) monte
  # compileSdk à 37, au-delà de ce que notre AGP 9.0.1 supporte (plafond
  # documenté : API 36.1) — d'où l'échec de build « target android-37 ».
  # La 10.3.1 cible compileSdk 36 et a déjà les chiffrements modernes (AES-GCM
  # + clé RSA enveloppée du Keystore), rien de ce qu'on utilise (LocalStorage /
  # GotrueAsyncStorage) ne dépend d'une nouveauté de la 11.x. minSdk 24 = défaut
  # Flutter, aucun changement android/. À rouvrir quand l'AGP suivra le SDK 37
  # (écart documenté au Journal, 10/08/2026).
  flutter_secure_storage: ">=10.3.1 <11.0.0"

  # Lecture PDF (etape 17, ecran 7) : rendu de page, pagination, zoom d'echelle.
  # Licence MIT, sans demarche de licence commerciale (contrairement a
  # syncfusion_flutter_pdfviewer). Ouvre un PDF depuis un asset, un fichier ou des
  # bytes — couvre le besoin de l'ecran 7 et le futur offline-first (Phase 3).
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Génération de code Drift : build_runner (moteur) + drift_dev (greffon). (Lot D)
  # Versions volontairement en retrait des toutes dernières : build_runner 2.16.0
  # et drift_dev 2.34.5 exigent meta ^1.18.3, alors que notre Flutter SDK 3.44.8
  # épingle meta 1.18.0. Ces pins sont les plus hautes compatibles avec ce SDK ;
  # à réévaluer lors d'une future montée de version de Flutter.
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # DEMO TEMPORAIRE (etape 17) : UN seul PDF reel deja commite, embarque pour
  # prouver le lecteur (ecran 7) alors que la base est vide jusqu'a l'etape 18.
  # Reference en LECTURE SEULE un fichier de assets/bibliotheque/ (zone rouge NON
  # modifiee). A RETIRER a l'etape 18, quand le contenu reel arrive par Storage
  # (voir data/demo/ et le drapeau MODE_DEMO).
  assets:
    - "assets/bibliotheque/6e-maths/01 - Activités Numériques/Chap 01 - Nombres décimaux arithmétiques/01 - Cours/Cours - Chap 01 - Nombres décimaux arithmétiques.pdf"

  # Police d'interface : Poppins, embarquee en local (fichiers .ttf dans fonts/),
  # PAS via le paquet google_fonts qui peut telecharger la police au premier
  # lancement — incompatible avec l'offline-first (CLAUDE.md §5, etape 11).
  # Seules les 4 graisses reellement utilisees par le TextTheme sont embarquees
  # (Regular/Medium/SemiBold/Bold), pour ne pas gonfler l'APK. Licence SIL OFL :
  # fonts/OFL.txt.
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
